name: Update Streak Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist folder
        run: mkdir -p dist

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: mrw-wq
          theme: rose_pine
          timezone: "Africa/Nairobi"
          file: dist/streak.svg
          token: ${{ secrets.PAT_1 }}   # <-- This fixes the rate limit!

      - name: Check if file exists (Debug)
        run: |
          echo "Listing current directory:"
          ls -la
          echo "Listing dist directory if it exists:"
          ls -la dist || echo "dist folder does not exist"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/streak.svg -f
          git commit -m "Updated streak stats" || exit 0
          git push
